<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Taxpy — Consultor Tributario Chileno</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --border: #2a2d3e;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --text: #e2e8f0;
      --text-muted: #64748b;
      --user-bubble: #1e3a5f;
      --bot-bubble: #1a1d27;
      --error-bg: #1f1215;
      --error-border: #7f1d1d;
      --error-text: #fca5a5;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ── */
    header {
      padding: 0.85rem 1.25rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-shrink: 0;
      background: var(--surface);
    }

    .logo {
      font-size: 1.4rem;
      line-height: 1;
    }

    .header-text h1 {
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .header-text p {
      font-size: 0.7rem;
      color: var(--text-muted);
      margin-top: 1px;
    }

    .quota-badge {
      margin-left: auto;
      font-size: 0.7rem;
      padding: 0.2rem 0.55rem;
      border-radius: 999px;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text-muted);
      white-space: nowrap;
      transition: color 0.2s;
    }

    /* ── Chat area ── */
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 1.25rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      scroll-behavior: smooth;
    }

    #chat::-webkit-scrollbar { width: 5px; }
    #chat::-webkit-scrollbar-track { background: transparent; }
    #chat::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    /* ── Messages ── */
    .message {
      max-width: min(75%, 680px);
      line-height: 1.65;
      font-size: 0.875rem;
      word-break: break-word;
    }

    .message.user {
      align-self: flex-end;
      background: var(--user-bubble);
      padding: 0.65rem 0.9rem;
      border-radius: 1rem 1rem 0.2rem 1rem;
      border: 1px solid #2d5a9e;
      color: #bfdbfe;
    }

    .message.bot {
      align-self: flex-start;
      background: var(--bot-bubble);
      padding: 0.75rem 1rem;
      border-radius: 0.2rem 1rem 1rem 1rem;
      border: 1px solid var(--border);
      white-space: pre-wrap;
    }

    .message.bot.error {
      background: var(--error-bg);
      border-color: var(--error-border);
      color: var(--error-text);
    }

    /* ── Typing indicator ── */
    .typing {
      align-self: flex-start;
      display: flex;
      gap: 5px;
      padding: 0.75rem 0.9rem;
      background: var(--bot-bubble);
      border: 1px solid var(--border);
      border-radius: 0.2rem 1rem 1rem 1rem;
    }

    .typing span {
      width: 7px; height: 7px;
      background: var(--text-muted);
      border-radius: 50%;
      animation: bounce 1.3s ease-in-out infinite;
    }
    .typing span:nth-child(2) { animation-delay: 0.18s; }
    .typing span:nth-child(3) { animation-delay: 0.36s; }

    @keyframes bounce {
      0%, 75%, 100% { transform: translateY(0); opacity: 0.5; }
      35% { transform: translateY(-7px); opacity: 1; }
    }

    /* ── Welcome screen ── */
    .welcome {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: var(--text-muted);
      padding: 2rem;
      pointer-events: none;
    }

    .welcome .icon { font-size: 3rem; margin-bottom: 1rem; }

    .welcome h2 {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 0.5rem;
    }

    .welcome p {
      font-size: 0.8rem;
      max-width: 380px;
      line-height: 1.6;
    }

    .welcome .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      justify-content: center;
      margin-top: 1.25rem;
      pointer-events: all;
    }

    .chip {
      font-size: 0.72rem;
      padding: 0.35rem 0.75rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 999px;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
      color: var(--text-muted);
      text-align: left;
    }

    .chip:hover {
      border-color: var(--accent);
      color: var(--text);
    }

    /* ── Footer / input area ── */
    footer {
      padding: 0.75rem 1rem;
      border-top: 1px solid var(--border);
      background: var(--surface);
      display: flex;
      gap: 0.6rem;
      flex-shrink: 0;
      align-items: flex-end;
    }

    .mode-select {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text-muted);
      border-radius: 0.5rem;
      padding: 0.55rem 0.6rem;
      font-size: 0.72rem;
      cursor: pointer;
      flex-shrink: 0;
      height: 38px;
    }

    .mode-select:focus { outline: none; border-color: var(--accent); }

    #input {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 0.65rem;
      padding: 0.6rem 0.85rem;
      font-size: 0.875rem;
      font-family: inherit;
      resize: none;
      min-height: 38px;
      max-height: 130px;
      line-height: 1.5;
      transition: border-color 0.15s;
      overflow-y: auto;
    }

    #input::placeholder { color: var(--text-muted); }
    #input:focus { outline: none; border-color: var(--accent); }
    #input:disabled { opacity: 0.5; }

    #send {
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 0.65rem;
      padding: 0 1rem;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      flex-shrink: 0;
      height: 38px;
      transition: background 0.15s, opacity 0.15s;
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }

    #send:hover:not(:disabled) { background: var(--accent-hover); }
    #send:disabled { opacity: 0.45; cursor: not-allowed; }

    /* ── Responsive ── */
    @media (max-width: 520px) {
      .message { max-width: 92%; }
      #chat { padding: 1rem 0.75rem; }
      footer { padding: 0.65rem 0.75rem; }
      .mode-select { display: none; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">⚖️</div>
  <div class="header-text">
    <h1>Taxpy</h1>
    <p>Consultor de legislación tributaria chilena</p>
  </div>
  <div class="quota-badge" id="quota-badge">— consultas disponibles</div>
</header>

<div id="chat">
  <div class="welcome" id="welcome">
    <div class="icon">📚</div>
    <h2>¿En qué te puedo ayudar?</h2>
    <p>Respondo preguntas sobre el Código Tributario, Ley de Impuesto a la Renta, IVA, circulares del SII y jurisprudencia administrativa chilena.</p>
    <div class="chips">
      <button class="chip" onclick="fillQuestion(this)">¿Qué gastos son deducibles bajo el art. 31 LIR?</button>
      <button class="chip" onclick="fillQuestion(this)">¿Cómo funciona el régimen del art. 14 A?</button>
      <button class="chip" onclick="fillQuestion(this)">¿Cuándo se devenga el IVA en una venta?</button>
      <button class="chip" onclick="fillQuestion(this)">¿Qué es la prescripción tributaria en el art. 200 CT?</button>
    </div>
  </div>
</div>

<footer>
  <select class="mode-select" id="mode" title="Modo de respuesta">
    <option value="tax">⚖️ Legal</option>
    <option value="writer">✍️ Redacción</option>
  </select>
  <textarea id="input" rows="1" placeholder="Escribe tu consulta tributaria..."></textarea>
  <button id="send" onclick="handleSend()">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <line x1="22" y1="2" x2="11" y2="13"></line>
      <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
    </svg>
    Enviar
  </button>
</footer>

<script>
  // ── Config ───────────────────────────────────────────────────────
  const API_BASE = window.location.origin;
  const API_KEY  = "";  // Vacío si API_ACCESS_TOKEN no está configurado

  // ── User ID anónimo persistente ──────────────────────────────────
  function getOrCreateUserId() {
    let id = localStorage.getItem("taxpy_uid");
    if (!id) {
      id = "web_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2, 7);
      localStorage.setItem("taxpy_uid", id);
    }
    return id;
  }
  const USER_ID = getOrCreateUserId();

  // ── DOM ──────────────────────────────────────────────────────────
  const chat      = document.getElementById("chat");
  const input     = document.getElementById("input");
  const sendBtn   = document.getElementById("send");
  const modeEl    = document.getElementById("mode");
  const quotaBadge = document.getElementById("quota-badge");
  let isLoading   = false;

  // ── Auto-resize textarea ─────────────────────────────────────────
  input.addEventListener("input", () => {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 130) + "px";
  });

  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      handleSend();
    }
  });

  // ── Suggestion chips ─────────────────────────────────────────────
  function fillQuestion(el) {
    input.value = el.textContent.trim();
    input.dispatchEvent(new Event("input"));
    input.focus();
  }

  // ── UI helpers ───────────────────────────────────────────────────
  function removeWelcome() {
    const w = document.getElementById("welcome");
    if (w) w.remove();
  }

  function scrollBottom() {
    chat.scrollTop = chat.scrollHeight;
  }

  function appendMessage(text, role, isError = false) {
    removeWelcome();
    const div = document.createElement("div");
    div.className = "message " + role + (isError ? " error" : "");
    div.textContent = text;
    chat.appendChild(div);
    scrollBottom();
    return div;
  }

  function showTyping() {
    removeWelcome();
    const div = document.createElement("div");
    div.className = "typing";
    div.id = "typing";
    div.innerHTML = "<span></span><span></span><span></span>";
    chat.appendChild(div);
    scrollBottom();
  }

  function hideTyping() {
    const t = document.getElementById("typing");
    if (t) t.remove();
  }

  function setLoading(v) {
    isLoading = v;
    sendBtn.disabled = v;
    input.disabled = v;
    sendBtn.querySelector("svg").style.opacity = v ? "0.5" : "1";
  }

  function updateQuota(remaining, quota) {
    quotaBadge.textContent = remaining + " / " + quota + " consultas";
    quotaBadge.style.color = remaining <= 2 ? "#f59e0b" : "";
  }

  // ── Main send ────────────────────────────────────────────────────
  async function handleSend() {
    const question = input.value.trim();
    if (!question || isLoading) return;

    appendMessage(question, "user");
    input.value = "";
    input.style.height = "auto";
    setLoading(true);
    showTyping();

    const headers = { "Content-Type": "application/json" };
    if (API_KEY) headers["X-API-Key"] = API_KEY;

    try {
      const res = await fetch(API_BASE + "/ask", {
        method: "POST",
        headers,
        body: JSON.stringify({
          user_id: USER_ID,
          question,
          mode: modeEl.value,
          top_juris: 8,
          include_derogadas: false,
        }),
      });

      hideTyping();

      if (!res.ok) {
        let msg;
        try {
          const err = await res.json();
          msg = err.detail || "Error " + res.status;
        } catch {
          msg = "Error " + res.status;
        }
        if (res.status === 402) {
          msg = "Agotaste tu cuota gratuita mensual. Contacta para plan PRO.";
        }
        appendMessage(msg, "bot", true);
      } else {
        const data = await res.json();
        appendMessage(data.answer, "bot");
        updateQuota(data.remaining, data.quota);
      }
    } catch {
      hideTyping();
      appendMessage("No se pudo conectar con el servidor. Intenta nuevamente.", "bot", true);
    }

    setLoading(false);
    input.focus();
  }
</script>

</body>
</html>
